services:
  postgres:
    image: postgres:16
    container_name: eventhub-postgres
    environment:
      POSTGRES_USER: eventhub
      POSTGRES_PASSWORD: eventhub
      POSTGRES_DB: eventhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: eventhub-redis
    ports:
      - "6379:6379"

  auth-service:
    build: ./auth-service
    container_name: eventhub-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventhub
    depends_on:
      postgres:
        condition: service_healthy

  event-service:
    build: ./event-service
    container_name: eventhub-event-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventhub
    depends_on:
      postgres:
        condition: service_healthy

  booking-service:
    build: ./booking-service
    container_name: eventhub-booking-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventhub
      SPRING_DATA_REDIS_HOST: redis
      EVENTHUB_EVENT_SERVICE_BASE_URL: http://event-service:8082
      EVENTHUB_PAYMENT_SERVICE_BASE_URL: http://payment-service:8084
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      event-service:
        condition: service_started
      payment-service:
        condition: service_started

  payment-service:
    build: ./payment-service
    container_name: eventhub-payment-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventhub
      EVENTHUB_BOOKING_SERVICE_WEBHOOK_URL: http://booking-service:8083/webhooks/payment
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: eventhub-frontend
    ports:
      - "5173:80"
    depends_on:
      - auth-service
      - event-service
      - booking-service

volumes:
  postgres_data:
