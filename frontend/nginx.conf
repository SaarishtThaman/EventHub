server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router handles routing client-side, so any path that isn't a real
    # static file (e.g. /events/3, refreshed directly) needs to fall back to
    # index.html rather than 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
