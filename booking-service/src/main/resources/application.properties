spring.application.name=booking-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/eventhub
spring.datasource.username=eventhub
spring.datasource.password=eventhub

# Flyway owns the schema; Hibernate should only validate entities against it, never auto-generate DDL
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.schemas=booking
spring.jpa.properties.hibernate.default_schema=booking

spring.data.redis.host=localhost
spring.data.redis.port=6379

booking.seat-lock.ttl-seconds=300
booking.payment-context.ttl-seconds=900

eventhub.event-service.base-url=http://localhost:8082
eventhub.payment-service.base-url=http://localhost:8084
