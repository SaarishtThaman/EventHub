spring.application.name=auth-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/eventhub
spring.datasource.username=eventhub
spring.datasource.password=eventhub

# Flyway owns the schema; Hibernate should only validate entities against it, never auto-generate DDL
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.schemas=auth
spring.jpa.properties.hibernate.default_schema=auth
